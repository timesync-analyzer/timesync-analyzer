services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: timescaledb
    restart: unless-stopped
    env_file:
      - config/.env
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./scripts/create_users.sh:/docker-entrypoint-initdb.d/01-create-users.sh:ro
    shm_size: 256mb
    command:
      - "postgres"
      - "-c"
      - "max_connections=${POSTGRES_MAX_CONNECTIONS}"
      - "-c"
      - "shared_buffers=${POSTGRES_SHARED_BUFFERS}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    env_file:
      - config/.env
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=volkovlabs-form-panel,yesoreyeram-infinity-datasource
      - REPORT_TOKEN=${REPORT_TOKEN:-}
      - GF_RENDERING_SERVER_URL=http://grafana-renderer:8081/render
      - GF_RENDERING_CALLBACK_URL=http://grafana:3000/
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=smtp.yandex.ru:587
      - GF_SMTP_USER=${SMTP_USER}
      - GF_SMTP_PASSWORD=${SMTP_PASSWORD}
      - GF_SMTP_FROM_ADDRESS=${SMTP_FROM_ADDRESS}
      - GF_SMTP_FROM_NAME=Grafana Alerts
      - GF_SMTP_STARTTLS_POLICY=MandatoryStartTLS
      - GF_DATE_FORMATS_DEFAULT_TIMEZONE=${TZ:-UTC}
      - TZ=${TZ:-UTC}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      timescaledb:
        condition: service_healthy
      grafana-renderer:
        condition: service_started

  grafana-renderer:
    image: grafana/grafana-image-renderer:latest
    container_name: grafana-renderer
    restart: unless-stopped
    environment:
      - ENABLE_METRICS=true

  analyzer:
    build:
      context: .
      dockerfile: Dockerfile
    image: timesync-analyzer:latest
    container_name: timesync-analyzer
    restart: unless-stopped
    env_file:
      - config/.env
    environment:
      - DB_HOST=timescaledb
      - DB_PORT=5432
      - TZ=${TZ:-UTC}
    ports:
      - "${ANALYZER_ZMQ_PORT:-10000}:10000"
    depends_on:
      timescaledb:
        condition: service_healthy

  reportd:
    build:
      context: .
      dockerfile: Dockerfile
    image: timesync-analyzer:latest
    container_name: timesync-reportd
    restart: unless-stopped
    env_file:
      - config/.env
    environment:
      - DB_HOST=timescaledb
      - DB_PORT=5432
      - GRAFANA_URL=http://grafana:3000
      - REPORT_TOKEN=${REPORT_TOKEN:-}
      - TZ=${TZ:-UTC}
    entrypoint: ["/app/reportd"]
    command:
      - "-config"
      - "/app/config/config.yaml"
      - "-out"
      - "/reports"
      - "-listen"
      - ":8080"
    ports:
      - "${REPORTD_PORT:-8080}:8080"
    volumes:
      - reports_data:/reports
    depends_on:
      timescaledb:
        condition: service_healthy
      grafana:
        condition: service_started
      grafana-renderer:
        condition: service_started

volumes:
  timescaledb_data:
  grafana_data:
  reports_data:
