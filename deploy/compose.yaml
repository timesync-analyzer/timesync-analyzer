name: timesync

x-db-client: &db-client
  DB_HOST: timescaledb
  DB_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
  APP_USER: ${APP_USER:?Set APP_USER}
  APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD}
  APP_ENV: prod
  TZ: ${TZ:-UTC}

services:
  timescaledb:
    image: timesync-db:${RELEASE:?Set RELEASE}
    pull_policy: never
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TIMESCALEDB_TELEMETRY: "off"
      TZ: ${TZ:-UTC}
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    shm_size: 256mb
    command: [postgres, -c, "max_connections=${POSTGRES_MAX_CONNECTIONS:-100}", -c, "shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}"]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  migrate:
    image: timesync-analyzer:${RELEASE}
    pull_policy: never
    restart: "no"
    environment:
      <<: *db-client
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ADMIN_USER: ${ADMIN_USER:?Set ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      READONLY_USER: ${READONLY_USER:?Set READONLY_USER}
      READONLY_PASSWORD: ${READONLY_PASSWORD:?Set READONLY_PASSWORD}
    entrypoint: [/bin/sh, /app/deploy/migrate.sh]
    command: [up]
    depends_on:
      timescaledb:
        condition: service_healthy

  analyzer:
    image: timesync-analyzer:${RELEASE}
    pull_policy: never
    restart: unless-stopped
    environment:
      <<: *db-client
      ZMQ_ADDRESS: tcp://*:10000
    ports:
      - "${ANALYZER_ZMQ_PORT:-10000}:10000"
    volumes:
      - ./config.yaml:/app/config/config.yaml:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  grafana-renderer:
    image: timesync-renderer:${RELEASE}
    pull_policy: never
    restart: unless-stopped
    environment:
      AUTH_TOKEN: ${RENDERER_TOKEN:?Set RENDERER_TOKEN}
      TZ: ${TZ:-UTC}

  grafana:
    image: timesync-grafana:${RELEASE}
    pull_policy: never
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      READONLY_USER: ${READONLY_USER}
      READONLY_PASSWORD: ${READONLY_PASSWORD}
      REPORT_TOKEN: ${REPORT_TOKEN:?Set REPORT_TOKEN}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
      GF_PLUGINS_PUBLIC_KEY_RETRIEVAL_DISABLED: "true"
      GF_INSTALL_PLUGINS: ""
      GF_PLUGINS_PREINSTALL: ""
      GF_PLUGINS_PREINSTALL_SYNC: ""
      GF_SMTP_ENABLED: "false"
      GF_RENDERING_SERVER_URL: http://grafana-renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
      GF_RENDERING_RENDERER_TOKEN: ${RENDERER_TOKEN}
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: ${TZ:-UTC}
      TZ: ${TZ:-UTC}
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      migrate:
        condition: service_completed_successfully
      grafana-renderer:
        condition: service_started

  reportd:
    image: timesync-analyzer:${RELEASE}
    pull_policy: never
    restart: unless-stopped
    environment:
      <<: *db-client
      GRAFANA_URL: http://grafana:3000
      GRAFANA_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      REPORTD_OUT_DIR: /reports
      REPORTD_LISTEN: :8080
      REPORT_TOKEN: ${REPORT_TOKEN}
    entrypoint: [/app/reportd]
    command: [-config, /app/config/config.yaml]
    ports:
      - "${REPORTD_PORT:-8080}:8080"
    volumes:
      - reports_data:/reports
      - ./config.yaml:/app/config/config.yaml:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      grafana:
        condition: service_started

volumes:
  timescaledb_data:
  grafana_data:
  reports_data:
